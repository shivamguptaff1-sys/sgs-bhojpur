        // विषय शुरू करने का फंक्शन
        function runSubject(subjectKey) {
            var nameInput = document.getElementById("txtName").value.trim();
            if (nameInput === "") {
                alert("कृपया टेस्ट शुरू करने से पहले अपना नाम दर्ज करें!");
                return;
            }

            studentNameVal = nameInput;
            quizQuestions = testData[subjectKey];

            if(!quizQuestions || quizQuestions.length === 0) {
                alert("इस विषय के प्रश्न अभी उपलब्ध नहीं हैं!");
                return;
            }

            // विषय का नाम सेट करें
            if(subjectKey === 'physics') currentSubjectTitle = "भौतिकी (Physics)";
            else if(subjectKey === 'english') currentSubjectTitle = "English";
            else if(subjectKey === 'math') currentSubjectTitle = "गणित (Math)";
            else if(subjectKey === 'chemistry') currentSubjectTitle = "रसायन (Chemistry)";

            // स्क्रीन बदलें
            document.getElementById("screenLogin").style.display = "none";
            document.getElementById("screenQuiz").style.display = "block";

            // टेस्ट शुरू करें
            activeIdx = 0;
            totalScore = 0;
            startTimer();
            loadQuestion();
        }

        // प्रश्न लोड करने का फंक्शन
        function loadQuestion() {
            if (activeIdx >= quizQuestions.length) {
                showResult();
                return;
            }

            var qData = quizQuestions[activeIdx];
            var totalQ = quizQuestions.length;

            // UI अपडेट करें
            document.getElementById("txtQIndex").innerText = "प्रश्न: " + (activeIdx + 1) + " / " + totalQ;
            document.getElementById("barProgress").style.width = ((activeIdx / totalQ) * 100) + "%";
            document.getElementById("txtQuestion").innerText = qData.q;

            // विकल्प (Options) बनायें
            var optionsHtml = "";
            for (var i = 0; i < qData.o.length; i++) {
                optionsHtml += '<button class="opt-btn" onclick="checkAnswer(' + i + ', ' + qData.a + ', this)">' + qData.o[i] + '</button>';
            }
            document.getElementById("boxOptions").innerHTML = optionsHtml;
        }

        // उत्तर चेक करने का फंक्शन
        function checkAnswer(selectedIdx, correctIdx, btnElement) {
            var allBtns = document.getElementById("boxOptions").getElementsByTagName("button");
            
            // सारे बटन डिसएबल (Disable) करें ताकि बच्चा दोबारा क्लिक ना कर सके
            for (var i = 0; i < allBtns.length; i++) {
                allBtns[i].disabled = true;
                if (i === correctIdx) {
                    allBtns[i].classList.add("correct"); // सही वाले को हरा रंग दें
                }
            }

            // स्कोर जोड़ें या गलत को लाल करें
            if (selectedIdx === correctIdx) {
                totalScore++;
            } else {
                btnElement.classList.add("wrong");
            }

            // 1 सेकंड बाद अगला प्रश्न लोड करें
            setTimeout(function() {
                activeIdx++;
                loadQuestion();
            }, 1000);
        }

        // रिजल्ट दिखाने का फंक्शन
        function showResult() {
            clearInterval(timerInterval); // टाइमर रोक दें
            document.getElementById("screenQuiz").style.display = "none";
            document.getElementById("screenResult").style.display = "block";

            var totalQ = quizQuestions.length;
            var percent = Math.round((totalScore / totalQ) * 100);
            var today = new Date().toLocaleDateString('en-IN'); // आज की तारीख

            document.getElementById("txtScore").innerText = totalScore + " / " + totalQ;
            document.getElementById("resName").innerText = studentNameVal;
            document.getElementById("resSubject").innerText = currentSubjectTitle;
            document.getElementById("resDate").innerText = today;
            document.getElementById("resPercent").innerText = percent;
            
            // रिजल्ट स्क्रीन का प्रोग्रेस बार 100% कर दें
            document.getElementById("barProgress").style.width = "100%";
        }

        // 50 मिनट का टाइमर
        function startTimer() {
            var totalSeconds = 50 * 60; // 50 मिनट
            var timerDisplay = document.getElementById("txtTimer");
            
            timerInterval = setInterval(function() {
                var minutes = Math.floor(totalSeconds / 60);
                var seconds = totalSeconds % 60;
                
                minutes = minutes < 10 ? "0" + minutes : minutes;
                seconds = seconds < 10 ? "0" + seconds : seconds;
                
                timerDisplay.innerText = minutes + ":" + seconds;
                
                if (totalSeconds <= 0) {
                    clearInterval(timerInterval);
                    alert("समय समाप्त! आपका टेस्ट आटोमेटिक सबमिट हो रहा है।");
                    showResult();
                } else {
                    totalSeconds--;
                }
            }, 1000);
        }
    </script>
</body>
  </html>
